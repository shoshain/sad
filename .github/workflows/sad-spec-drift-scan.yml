name: sad-spec-drift-scan

# Scheduled drift scan. Runs weekly on main; can also be invoked manually.
# Writes .sad/state/drift-report.md if any feature is missing reconciliation.

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: drift-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run drift scan
        run: |
          bash .sad/scripts/drift-scan.sh | tee drift-report.txt
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sad-drift-report
          path: drift-report.txt
          if-no-files-found: ignore
          retention-days: 30
